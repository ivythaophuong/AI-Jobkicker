##############################################################
# CareerAiHub — Nginx Configuration
# File: /etc/nginx/sites-available/careeraihub
##############################################################
#
# BEFORE USING THIS FILE:
# 1. Replace YOUR_SERVER_IP with your Hostinger VPS IP
# 2. Make sure careeraihub.com DNS A record → YOUR_SERVER_IP
# 3. Run certbot after enabling this config (see deploy.sh)
#

server {
    listen 80;
    listen [::]:80;
    server_name careeraihub.com www.careeraihub.com;

    # Redirect all HTTP → HTTPS (after certbot adds SSL block below)
    return 301 https://careeraihub.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name careeraihub.com www.careeraihub.com;

    # ── SSL (certbot fills these in automatically) ──────────────
    ssl_certificate     /etc/letsencrypt/live/careeraihub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careeraihub.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Root — landing page ──────────────────────────────────────
    root /var/www/careeraihub;
    index index.html;

    # ── Landing page (root) ──────────────────────────────────────
    location = / {
        try_files /index.html =404;
    }

    # ── Static pages ─────────────────────────────────────────────
    location ~* \.(html|css|js|ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── React App — served from /app ────────────────────────────
    # The React SPA (dream-job-ai built files) lives here
    location /app {
        alias /var/www/careeraihub/app;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
    }

    # ── Redirect www → non-www ───────────────────────────────────
    if ($host = www.careeraihub.com) {
        return 301 https://careeraihub.com$request_uri;
    }

    # ── Gzip compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    # ── 404 page ─────────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
